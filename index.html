<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a12">
  <title>2026 世界盃已結束</title>
  <style>
    :root {
      color-scheme: dark;
      --green-dark: #071a12;
      --green: #0c4f32;
      --lime: #c9f24b;
      --muted: rgba(255, 255, 255, 0.68);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: white;
      background:
        radial-gradient(circle at 50% 18%, rgba(201, 242, 75, 0.18), transparent 18rem),
        linear-gradient(135deg, var(--green-dark), var(--green));
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      background: rgba(7, 26, 18, 0.72);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    .mark {
      display: grid;
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      color: var(--lime);
      font-size: 26px;
      font-weight: 900;
    }

    .kicker {
      margin: 0 0 12px;
      color: var(--lime);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.22em;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 72px);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .copy {
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.8;
    }

    .meta {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">26</div>
    <p class="kicker">WORLD CUP LIVE BOARD</p>
    <h1>2026 世界盃已結束</h1>
    <p class="copy">
      感謝這段時間一起追賽程、比分、淘汰賽與所有精彩瞬間。
      這個看板目前已停止更新。
    </p>
    <p class="meta">時間皆為台灣時間。網站已保留為賽事結束頁。</p>
  </main>
</body>
</html>
